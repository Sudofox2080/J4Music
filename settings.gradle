pluginManagement {
    repositories {
        // 离线本地仓库优先，其次官方源（有网时会自动回落）
        maven { url = new File(rootDir, '.gradle-home/m2/repository').toURI().toString(); allowInsecureProtocol = true }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // PREFER_SETTINGS 会在项目里也声明仓库时优先用这里
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven { url = new File(rootDir, '.gradle-home/m2/repository').toURI().toString(); allowInsecureProtocol = true }
        google()
        mavenCentral()
    }
}

rootProject.name = "J4Music"
include ':app'
