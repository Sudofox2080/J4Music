// 离线本地 Maven 仓库：把 ~/.gradle 的 files-2.1 缓存按 group/artifact/version 铺平成标准仓库结构。
// 本机外网被劫持，联网解析不可用，所以构建只依赖这个目录。
// 项目迁移到有网络的环境时，删掉本文件里的 maven { url ... } 即可回落到 google()/mavenCentral()。
def offlineRepo = new File(rootProject.projectDir, '.gradle-home/m2/repository')
if (offlineRepo.exists()) {
    gradle.beforeProject { p ->
        p.buildscript.repositories {
            maven { url = offlineRepo.toURI().toString(); allowInsecureProtocol = true }
        }
        p.repositories {
            maven { url = offlineRepo.toURI().toString(); allowInsecureProtocol = true }
        }
    }
}
